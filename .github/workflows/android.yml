name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and sign the APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Raah-Suraksha-Android
          path: build/android/Raah-Suraksha.apk*
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: python3 android/smoke.py
      - name: Publish the tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" build/android/Raah-Suraksha.apk build/android/Raah-Suraksha.apk.sha256 --target "$GITHUB_SHA" --title "Raah Suraksha for Android" --notes "Download Raah-Suraksha.apk on your Android phone. Includes the offline demo walks, on-device C++ scoring, police contacts and trusted-contact settings. Live services need internet. Signed hackathon build."

